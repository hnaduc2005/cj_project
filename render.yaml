services:
  - type: web
    name: cj-purchase-ordering-api
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    autoDeployTrigger: commit
    healthCheckPath: /
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Paste the same Neon PostgreSQL URL used for the verified local migration.
      - key: DATABASE_URL
        sync: false
      # Enter the exact Vercel production URL, without a trailing slash.
      - key: APP_URL
        sync: false
      - key: MAIL_PROVIDER
        value: GMAIL
      # Keep this false until login, data, and test-email checks pass.
      - key: MAIL_ENABLED
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
